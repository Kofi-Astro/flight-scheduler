<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Flight scouting & booking assistant — search, compare and shortlist flights worldwide for clients." />
  <meta name="theme-color" content="#0b1f3a" />
  <title>Flight Scout</title>

  <!--
    Favicon: inline SVG so there's no extra request and no binary asset to track.
  -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%88%EF%B8%8F%3C/text%3E%3C/svg%3E" />

  <!-- Design system, then base styles, then layout, then components. Order matters. -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/results.css" />

  <!--
    Runtime config generated by server.py from the API_BASE_URL env var.
    MUST load before our modules so window.__CONFIG__ exists.
  -->
  <script src="env.js"></script>
</head>
<body>
  <!-- ============================ App shell ============================ -->
  <header class="app-header">
    <div class="app-header__inner">
      <a class="brand" href="#/search" aria-label="Flight Scout home">
        <span class="brand__mark" aria-hidden="true">✈</span>
        <span class="brand__name">Flight&nbsp;Scout</span>
      </a>

      <nav class="tabs" aria-label="Primary">
        <a class="tabs__link" href="#/search" data-route="search">Search</a>
        <a class="tabs__link" href="#/shortlist" data-route="shortlist">
          Shortlist <span class="badge" data-shortlist-count hidden>0</span>
        </a>
        <a class="tabs__link" href="#/clients" data-route="clients">Clients</a>
        <a class="tabs__link" href="#/alerts" data-route="alerts">Alerts</a>
      </nav>

      <div class="app-header__aside">
        <!-- Currency toggle is mounted here by js/components/currencyToggle.js -->
        <div id="currency-toggle"></div>
        <button id="provider-status-btn" class="icon-btn" title="Data providers" aria-label="Data providers">ⓘ</button>
      </div>
    </div>
  </header>

  <!-- ============================ Views =============================== -->
  <!-- Exactly one view is visible at a time; app.js toggles [hidden]. -->
  <main class="app-main">
    <section id="view-search" class="view" data-route="search"></section>
    <section id="view-shortlist" class="view" data-route="shortlist" hidden></section>
    <section id="view-clients" class="view" data-route="clients" hidden></section>
    <section id="view-alerts" class="view" data-route="alerts" hidden></section>
  </main>

  <footer class="app-footer">
    <p>
      Flight Scout · prices &amp; availability are indicative until ticketed ·
      <a id="footer-providers" href="#">data sources</a>
    </p>
  </footer>

  <!-- Toast container (notifications) -->
  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>

  <!-- Modal root (share sheet, provider status, etc.) -->
  <div id="modal-root"></div>

  <!--
    Entry point. type="module" gives us ES module imports and defer semantics.
    Everything else is imported from here.
  -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
